services:
  - type: web
    name: tokocrypto-ai-trader
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node app.js
    envVars:
      - key: TOKOCRYPTO_API_KEY
        sync: false
      - key: TOKOCRYPTO_API_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: MODAL_MAX_IDR
        value: "87000"
